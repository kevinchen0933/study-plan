<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRE 單字</title>
<meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* 版面想法：和讀書計畫同一本筆記本。中間一張大字卡，上面是今天的進度，底下三顆評分按鈕拇指按得到。 */
:root{
  --paper:#f2f4f8; --surface:#ffffff; --ink:#18202e; --muted:#5b6676; --line:#d8dde6;
  --accent:#6a3fb5; --accent-soft:#efe9fa; --on-accent:#ffffff;
  --bad:#bf362e; --bad-soft:#fbeceb; --mid:#8a6a08; --mid-soft:#f8f0d8; --good:#1f7a55; --good-soft:#e3f3ec;
  --font-display:"Noto Serif TC",Georgia,"Songti TC",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#11151c; --surface:#1a2029; --ink:#e7ebf2; --muted:#98a3b3; --line:#2d3542;
    --accent:#b99af5; --accent-soft:#2a2244; --on-accent:#140f22;
    --bad:#ff8a7d; --bad-soft:#3a2020; --mid:#dbb245; --mid-soft:#332b14; --good:#5fc79a; --good-soft:#173328;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#11151c; --surface:#1a2029; --ink:#e7ebf2; --muted:#98a3b3; --line:#2d3542;
  --accent:#b99af5; --accent-soft:#2a2244; --on-accent:#140f22;
  --bad:#ff8a7d; --bad-soft:#3a2020; --mid:#dbb245; --mid-soft:#332b14; --good:#5fc79a; --good-soft:#173328;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:24px 16px 56px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px;
  border-bottom:2px solid var(--ink);padding-bottom:10px}
h1{font-family:var(--font-display);font-size:26px;line-height:1.2;margin:0;letter-spacing:.03em}
.sub{color:var(--muted);font-size:13px}
h2{font-size:15px;font-weight:700;margin:0;letter-spacing:.05em}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0}
.stat .k{font-size:12px;color:var(--muted);display:block}
.stat .v{font-family:var(--font-display);font-size:21px;line-height:1.3}
.stat .v small{font-family:var(--font-body);font-size:12px;font-weight:400;color:var(--muted);margin-left:2px}

.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px}
.tabs button{flex:1;height:36px;border:0;border-radius:7px;background:transparent;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.card{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:28px 16px;min-height:250px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.word{font-family:var(--font-display);font-size:38px;line-height:1.15;overflow-wrap:anywhere}
.pos{font-size:13px;color:var(--muted);font-style:italic}
.zh{font-size:20px;font-weight:700}
.en{color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 6px;color:var(--accent)}
.tag.learn{color:var(--mid)} .tag.known{color:var(--good)} .tag.new{color:var(--muted)}

.btn{height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);
  font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{height:32px;padding:0 10px;font-size:13px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;height:56px;line-height:1.2;padding:0 4px}
.rate .btn small{font-size:11.5px;font-weight:400;opacity:.85}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.mid{background:var(--mid-soft);border-color:var(--mid);color:var(--mid)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.link{background:none;border:0;padding:4px 6px;color:var(--accent);cursor:pointer;border-radius:4px;font-size:13.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=search]{height:38px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);min-width:0}
input[type=search]{width:100%}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:46px;height:auto;padding:8px 12px;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.verdict{font-weight:700}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .w{font-weight:700;overflow-wrap:anywhere}
.item .w i{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.item .m{grid-column:1;font-size:13.5px;color:var(--muted)}
.item .t{grid-row:1/3;grid-column:2}
.empty{color:var(--muted);text-align:center;padding:16px 0}
.done-big{font-family:var(--font-display);font-size:24px}
@media (max-width:420px){.stat .v{font-size:18px}.word{font-size:32px}}
</style>
</head>

    <div><h1>GRE 單字</h1><div class="sub" id="todayLine"></div></div>

    <button type="button" role="tab" data-view="quiz" aria-selected="false">測驗</button>
    <button type="button" role="tab" data-view="list" aria-selected="false">單字表</button>
  </div>
  <main id="main"></main>
</div>

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return n<10?"0"+n:""+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function addDays(s,n){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return iso(d)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

var TODAY=iso(new Date());

var S={cards:{},perDay:20,day:"",newToday:0,doneToday:0};
function load(){
  try{var r=localStorage.getItem(LS);if(r){var d=JSON.parse(r);if(d&&typeof d==="object"){
    S.cards=d.cards&&typeof d.cards==="object"?d.cards:{};S.perDay=+d.perDay||20;S.day=d.day||"";S.newToday=+d.newToday||0;S.doneToday=+d.doneToday||0}}}
  catch(e){canSave=false}
  rollDay();
}
function rollDay(){if(S.day!==TODAY){S.day=TODAY;S.newToday=0;S.doneToday=0}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));canSave=true}catch(e){canSave=false}
  $("saveNote").textContent=canSave?"進度存在這台裝置":"這裡無法儲存，關掉後進度會消失"}
function card(i){return S.cards[WORDS[i][0]]}
function box(i){var c=card(i);return c?c.b:0}
function status(i){var b=box(i);return b===0?["new","新字"]:b>=4?["known","已熟"]:["learn","學習中"]}

/* ---------- 複習 ---------- */
var view="study",queue=[],cur=-1,shown=false,sessionTotal=0,sessionDone=0;
function buildQueue(extra){
  var due=[],fresh=[],i;
  for(i=0;i<WORDS.length;i++){var c=card(i);if(c&&c.b>0&&c.d<=TODAY)due.push(i)}
  var room=Math.max(0,S.perDay-S.newToday)+(extra||0);
  for(i=0;i<ORDER.length&&fresh.length<room;i++){if(box(ORDER[i])===0)fresh.push(ORDER[i])}
  queue=shuffle(due).concat(fresh);sessionTotal=queue.length;sessionDone=0;next();
}
function next(){cur=queue.length?queue.shift():-1;shown=false}
function rate(r){
  if(cur<0)return;
  var w=WORDS[cur][0],c=S.cards[w]||{b:0,d:TODAY},wasNew=c.b===0;
  if(r===0){c.b=1;c.d=TODAY;queue.splice(Math.min(4,queue.length),0,cur);sessionTotal++}
  else if(r===1){c.b=Math.max(1,c.b);c.d=addDays(TODAY,1)}
  else{c.b=wasNew?3:Math.min(5,c.b+1);c.d=addDays(TODAY,GAP[c.b])}
  S.cards[w]=c;if(wasNew)S.newToday++;S.doneToday++;sessionDone++;
  save();next();render();
}

  }else{
    var w=WORDS[cur],st=status(cur),pct=sessionTotal?Math.round(sessionDone/sessionTotal*100):0;
    h+='<div class="progress"><span>這一輪 '+sessionDone+' / '+sessionTotal+'</span><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
    h+='<div class="card"><span class="tag '+st[0]+'">'+st[1]+'</span><div class="word" lang="en">'+esc(w[0])+'</div><div class="pos">'+POS[w[1]]+'</div>'+
       (shown?'<div class="zh">'+esc(w[2])+'</div><div class="en" lang="en">'+esc(w[3])+'</div>':'<div class="en">先在心裡想出意思，再看答案</div>')+
       '<button class="link" type="button" data-act="speak">聽發音</button></div>';
    h+=shown?'<div class="rate">'+
        '<button class="btn bad" type="button" data-rate="0">不記得<small>等一下再考</small></button>'+
        '<button class="btn mid" type="button" data-rate="1">有點印象<small>明天再考</small></button>'+
        '<button class="btn good" type="button" data-rate="2">記得<small>過幾天再考</small></button></div>'
      :'<button class="btn" type="button" data-act="show" id="showBtn">看答案</button>';
    h+='<div class="row">'+perDaySelect()+'</div>';
  }
  $("main").innerHTML=h+"</section>";
}

/* ---------- 測驗 ---------- */
var quiz=null;
function startQuiz(){
  var pool=[],i;for(i=0;i<WORDS.length;i++)if(box(i)>0)pool.push(i);
  var fromLearned=pool.length>=4;
  if(!fromLearned){pool=[];for(i=0;i<WORDS.length;i++)pool.push(i)}
  quiz={items:shuffle(pool).slice(0,10),n:0,score:0,picked:-1,opts:null,fromLearned:fromLearned,wrong:[]};
  makeOpts();
}
function makeOpts(){
  var a=quiz.items[quiz.n],same=[],i;
  for(i=0;i<WORDS.length;i++)if(i!==a&&WORDS[i][1]===WORDS[a][1]&&WORDS[i][2]!==WORDS[a][2])same.push(i);
  quiz.opts=shuffle([a].concat(shuffle(same).slice(0,3)));quiz.picked=-1;
}
function renderQuiz(){
  var h='<section class="panel">';
  if(!quiz){
    h+='<h2>選出正確的中文意思</h2><p class="sub" style="margin:0">一次 10 題，從你學過的字裡出題；學過的字不到 4 個時，會從全部的字出題。答錯的字會排回今天的複習。</p>'+
       '<button class="btn" type="button" data-act="quiz-start">開始測驗</button>';
  }else if(quiz.n>=quiz.items.length){
    h+='<div class="card"><div class="done-big">答對 '+quiz.score+' / '+quiz.items.length+' 題</div>'+
       (quiz.wrong.length?'<div class="en">答錯的字：<span lang="en">'+quiz.wrong.map(function(i){return esc(WORDS[i][0])}).join("、")+'</span></div>':'<div class="en">全部答對。</div>')+'</div>'+
       '<button class="btn" type="button" data-act="quiz-start">再測一次</button>';
  }else{
    var a=quiz.items[quiz.n],w=WORDS[a],done=quiz.picked>=0;
    h+='<div class="progress"><span>第 '+(quiz.n+1)+' / '+quiz.items.length+' 題</span><div class="bar"><i style="width:'+Math.round(quiz.n/quiz.items.length*100)+'%"></i></div></div>';
    h+='<div class="card" style="min-height:150px"><div class="word" lang="en">'+esc(w[0])+'</div><div class="pos">'+POS[w[1]]+'</div>'+
       '<button class="link" type="button" data-act="speak">聽發音</button></div><div class="opts">';
    quiz.opts.forEach(function(o){
      var cls=done?(o===a?" right":o===quiz.picked?" wrong":""):"";
      h+='<button class="opt'+cls+'" type="button" data-opt="'+o+'"'+(done?" disabled":"")+'>'+(done&&o===a?"✓ ":done&&o===quiz.picked?"✗ ":"")+esc(WORDS[o][2])+'</button>';
    });
    h+='</div>';
    if(done){h+='<div class="row between"><span class="verdict '+(quiz.picked===a?"ok":"no")+'">'+(quiz.picked===a?"答對了":"答錯了，正確答案是「"+esc(w[2])+"」")+'</span>'+
       '<button class="btn" type="button" data-act="quiz-next" id="nextBtn">'+(quiz.n+1>=quiz.items.length?"看結果":"下一題")+'</button></div>'}
  }
  $("main").innerHTML=h+"</section>";
}
function pick(o){
  if(!quiz||quiz.picked>=0)return;
  var a=quiz.items[quiz.n];quiz.picked=o;
  if(o===a)quiz.score++;
  else{quiz.wrong.push(a);var c=S.cards[WORDS[a][0]];if(c&&c.b>0){c.b=1;c.d=TODAY;save();if(queue.indexOf(a)<0&&cur!==a){queue.push(a);sessionTotal++}}}
  render();var b=$("nextBtn");if(b)b.focus();
}

/* ---------- 單字表 ---------- */
var q="",filter="all";
function renderList(keepFocus){
  var h='<section class="panel"><div class="row"><div style="flex:1;min-width:160px"><label class="sub" for="q">搜尋英文或中文</label><input type="search" id="q" value="'+esc(q)+'" autocomplete="off"></div>'+
    '<div><label class="sub" for="flt" style="display:block">顯示</label><select id="flt">'+
    [["all","全部"],["new","新字"],["learn","學習中"],["known","已熟"]].map(function(f){return '<option value="'+f[0]+'"'+(f[0]===filter?" selected":"")+'>'+f[1]+'</option>'}).join("")+
    '</select></div></div><div class="list" id="listBody"></div></section>';
  if(!keepFocus)$("main").innerHTML=h;
  var k=q.trim().toLowerCase(),rows="",n=0;
  for(var i=0;i<WORDS.length;i++){
    var w=WORDS[i],st=status(i);
    if(filter!=="all"&&st[0]!==filter)continue;
    if(k&&w[0].indexOf(k)<0&&w[2].indexOf(k)<0&&w[3].toLowerCase().indexOf(k)<0)continue;
    n++;
    rows+='<div class="item"><span class="w" lang="en">'+esc(w[0])+'<i>'+POS[w[1]]+'</i></span><span class="t"><span class="tag '+st[0]+'">'+st[1]+'</span></span>'+
          '<span class="m">'+esc(w[2])+'　<span lang="en">'+esc(w[3])+'</span></span></div>';
  }
  $("listBody").innerHTML=n?rows:'<div class="empty">沒有符合的單字</div>';
}

function render(){
  renderStats();
  var tabs=document.querySelectorAll(".tabs button");
  for(var i=0;i<tabs.length;i++)tabs[i].setAttribute("aria-selected",tabs[i].dataset.view===view?"true":"false");
  if(view==="study")renderStudy();else if(view==="quiz")renderQuiz();else renderList();
}

document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.view){view=t.dataset.view;render();return}
  if(t.dataset.rate){rate(+t.dataset.rate);return}
  if(t.dataset.opt){pick(+t.dataset.opt);return}
  var a=t.dataset.act;
  if(a==="show"){shown=true;render()}
  else if(a==="speak"){speak(WORDS[view==="quiz"&&quiz?quiz.items[quiz.n]:cur][0])}
  else if(a==="more"){buildQueue(10);render()}
  else if(a==="quiz-start"){startQuiz();render()}
  else if(a==="quiz-next"){quiz.n++;if(quiz.n<quiz.items.length)makeOpts();render()}
});
document.addEventListener("change",function(e){
  if(e.target.id==="perDay"){S.perDay=+e.target.value;save();if(cur<0){buildQueue();}render()}
  else if(e.target.id==="flt"){filter=e.target.value;renderList(true)}
});
document.addEventListener("input",function(e){if(e.target.id==="q"){q=e.target.value;renderList(true)}});
document.addEventListener("keydown",function(e){
  if(view!=="study"||cur<0||/^(INPUT|SELECT|BUTTON)$/.test(e.target.tagName))return;
  if(!shown&&(e.key===" "||e.key==="Enter")){e.preventDefault();shown=true;render()}
  else if(shown&&(e.key==="1"||e.key==="2"||e.key==="3"))rate(+e.key-1);
});
document.addEventListener("visibilitychange",function(){
  if(document.hidden)return;var t=iso(new Date());
  if(t!==TODAY){TODAY=t;rollDay();setToday();buildQueue();render()}
});
function setToday(){var n=new Date();$("todayLine").textContent=(n.getMonth()+1)+" 月 "+n.getDate()+" 日　共 "+WORDS.length+" 個高頻字"}
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}

load();setToday();save();buildQueue();render();
})();
</script>
</body>
</html>
